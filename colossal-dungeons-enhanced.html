<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colossal Dungeons Enhanced — Documento de diseño</title>
  <meta name="description" content="Documento maestro de diseño y producción del mod Colossal Dungeons Enhanced. Minecraft 1.21.1 · NeoForge." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   Colossal Dungeons Enhanced — hoja de estilo
   Tema oscuro, editorial, minimalista.
   ============================================================ */
:root{
  --bg:#0a0b0e;
  --bg-2:#0e1015;
  --surface:#13161d;
  --surface-2:#181c25;
  --line:#242a36;
  --line-soft:#1c212b;
  --text:#e8eaf0;
  --text-dim:#a2a9b8;
  --text-mute:#6d7585;
  --gold:#d8b26a;
  --gold-soft:#e7cd97;
  --accent:#8fb7c9;
  --radius:16px;
  --radius-sm:10px;
  --maxw:1180px;
  --sidew:264px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow:0 24px 60px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.12;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
::selection{background:rgba(216,178,106,.28)}
.muted{color:var(--text-mute)}
.bg-grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(143,183,201,.07), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(216,178,106,.06), transparent 55%);
}


/* ---------- SIDEBAR ---------- */
.sidebar{
  position:fixed;top:0;left:0;z-index:40;
  width:var(--sidew);height:100vh;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  padding:26px 20px 18px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;padding-left:4px}
.brand-mark{
  font-family:'Fraunces',serif;font-weight:700;font-size:19px;
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  color:var(--bg);background:linear-gradient(140deg,var(--gold-soft),var(--gold));
  box-shadow:0 8px 22px -8px rgba(216,178,106,.6);
}
.brand-mark span{color:rgba(10,11,14,.55)}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:15px;letter-spacing:.2px}
.brand-text span{font-size:12px;color:var(--gold-soft);letter-spacing:.28em;text-transform:uppercase}
.side-nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:-4px -6px;padding:4px 6px}
.side-nav::-webkit-scrollbar{width:6px}
.side-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.side-nav a{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  font-size:13.5px;color:var(--text-dim);
  transition:.2s var(--ease);position:relative;
}
.side-nav a .ix{font-size:11px;color:var(--text-mute);width:16px;text-align:center;transition:.2s}
.side-nav a:hover{background:var(--surface);color:var(--text)}
.side-nav a.active{background:var(--surface-2);color:var(--text)}
.side-nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.side-nav a.active .ix{color:var(--gold)}
.side-foot{font-size:11.5px;color:var(--text-mute);padding-top:14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.side-foot .dot{width:7px;height:7px;border-radius:50%;background:#5fbf7f;box-shadow:0 0 0 3px rgba(95,191,127,.16)}
.nav-toggle{display:none}


/* ---------- CONTENT + TOPBAR ---------- */
.content{position:relative;z-index:1;margin-left:var(--sidew);min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(10,11,14,.72);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px 40px;
}
.crumb{font-size:13px;color:var(--text-mute);letter-spacing:.14em;text-transform:uppercase}
.search-wrap{position:relative;width:min(360px,45vw)}
.search-wrap input{
  width:100%;background:var(--surface);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:10px 16px 10px 40px;font-size:13.5px;
  transition:.2s var(--ease);
}
.search-wrap input:focus{outline:none;border-color:var(--gold);background:var(--surface-2)}
.search-wrap::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-size:16px}
section.block{max-width:var(--maxw);margin:0 auto;padding:64px 40px 20px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:16px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
.sec-title{font-size:clamp(28px,3.6vw,42px);margin-bottom:12px}
.sec-lead{color:var(--text-dim);max-width:70ch;font-size:15.5px;margin-bottom:34px}
.divider{max-width:var(--maxw);margin:26px auto;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);padding:0 40px}


/* ---------- HERO ---------- */
.hero{max-width:var(--maxw);margin:0 auto;padding:72px 40px 26px;position:relative}
.hero h1{font-size:clamp(40px,6.6vw,86px);font-weight:600;letter-spacing:-.025em;line-height:1}
.hero h1 .sub{display:block;font-size:.34em;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-soft);font-family:'Inter',sans-serif;font-weight:500;margin-top:22px}
.hero-tag{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(17px,2vw,22px);color:var(--text-dim);margin:26px 0 8px;max-width:60ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pill{font-size:12px;letter-spacing:.05em;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);background:var(--surface)}
.pill.hot{border-color:rgba(216,178,106,.4);color:var(--gold-soft)}
.hero-intro{max-width:66ch;margin-top:30px;color:var(--text-dim);font-size:16px}
/* ---------- STAT PANEL ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-top:12px}
.stat{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:22px 20px;position:relative;overflow:hidden;transition:.25s var(--ease);
}
.stat:hover{border-color:var(--line);transform:translateY(-2px)}
.stat .v{font-family:'Fraunces',serif;font-size:38px;font-weight:600;color:var(--gold-soft);line-height:1}
.stat .l{font-size:13px;color:var(--text);margin-top:8px;font-weight:500}
.stat .s{font-size:12px;color:var(--text-mute);margin-top:2px}
/* ---------- PRINCIPLES ---------- */
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:8px}
.principle{display:flex;gap:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;font-size:14px;color:var(--text-dim)}
.principle .n{font-family:'Fraunces',serif;color:var(--gold);font-size:14px;min-width:22px}


/* ---------- DUNGEON CARDS ---------- */
.dungeon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.dcard{
  --c:var(--gold);
  position:relative;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px 22px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  transition:.3s var(--ease);min-height:214px;display:flex;flex-direction:column;
}
.dcard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);opacity:.5;transition:.3s}
.dcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.dcard:hover::before{opacity:1}
.dcard .idx{font-family:'Fraunces',serif;font-size:13px;color:var(--c);letter-spacing:.1em}
.dcard h3{font-size:24px;margin:10px 0 4px;position:relative}
.dcard .sub{font-style:italic;font-family:'Fraunces',serif;color:var(--text-dim);font-size:14px}
.dcard .theme{margin-top:auto;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-mute);padding-top:16px}
.dcard .boss-tag{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12.5px;color:var(--text-dim)}
.dcard .boss-tag b{color:var(--c);font-weight:600}
.dcard .arrow{position:absolute;right:22px;bottom:20px;color:var(--c);opacity:0;transform:translateX(-6px);transition:.3s}
.dcard:hover .arrow{opacity:1;transform:translateX(0)}
/* ---------- GENERIC CARD GRID ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:20px 20px 18px;transition:.25s var(--ease)}
.tcard:hover{border-color:var(--line);transform:translateY(-2px)}
.tcard h4{font-size:17px;margin-bottom:4px}
.tcard .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);display:inline-block;margin-bottom:10px}
.tcard p{font-size:13.5px;color:var(--text-dim)}
.tcard .cfg{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tcard .cfg span{font-size:11px;color:var(--text-mute);background:var(--bg-2);border:1px solid var(--line-soft);padding:3px 9px;border-radius:999px}
.badge-new{background:rgba(143,183,201,.14);color:var(--accent);border:1px solid rgba(143,183,201,.3);font-size:10px;padding:2px 8px;border-radius:999px;letter-spacing:.1em;margin-left:8px;vertical-align:middle}


/* ---------- BESTIARY ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-soft);color:var(--text-dim);
  transition:.18s var(--ease);user-select:none;
}
.chip:hover{border-color:var(--line);color:var(--text)}
.chip.active{background:var(--gold);color:#12130f;border-color:var(--gold);font-weight:600}
.filters.ranks .chip.active{background:var(--accent);border-color:var(--accent);color:#0b1418}
.count-line{font-size:12.5px;color:var(--text-mute);margin:2px 0 18px}
.mob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.mcard{
  position:relative;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:12px;padding:18px 18px 16px;cursor:pointer;transition:.22s var(--ease);
  overflow:hidden;display:flex;flex-direction:column;min-height:150px;
}
.mcard:hover{transform:translateY(-3px);border-color:var(--line)}
.mcard .rank{position:absolute;top:0;right:0;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-bottom-left-radius:10px;font-weight:600}
.r-normal{background:#20252f;color:#9aa4b4}
.r-elite{background:rgba(143,183,201,.16);color:#a7cbdb}
.r-miniboss{background:rgba(216,178,106,.16);color:var(--gold-soft)}
.r-boss{background:linear-gradient(135deg,rgba(216,178,106,.28),rgba(176,96,90,.24));color:#f0d69c}
.r-rare{background:rgba(157,107,143,.2);color:#d3a9c8}
.mcard h4{font-size:16px;margin:6px 42px 2px 0}
.mcard .en{font-size:12px;color:var(--text-mute);font-style:italic;font-family:'Fraunces',serif}
.mcard .home{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;color:var(--text-mute)}
.mcard .home b{color:var(--dc)}
.mcard .stats-mini{display:flex;gap:12px;margin-top:auto;padding-top:12px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap}
.mcard .stats-mini span b{color:var(--text);font-weight:600}
.empty{color:var(--text-mute);font-size:14px;padding:30px 0}


/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(4,5,7,.72);backdrop-filter:blur(6px);
  padding:5vh 20px;overflow-y:auto;
}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal-card{
  position:relative;width:min(760px,100%);margin:auto;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  animation:pop .3s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-close{
  position:absolute;top:16px;right:16px;z-index:2;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:14px;transition:.2s;
}
.modal-close:hover{color:var(--text);border-color:var(--gold);transform:rotate(90deg)}
.modal-body{padding:40px 40px 36px}
.modal-body .m-head{border-bottom:1px solid var(--line-soft);padding-bottom:20px;margin-bottom:22px}
.modal-body .m-rank{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.modal-body h2{font-size:32px;margin:10px 0 2px}
.modal-body .m-en{font-family:'Fraunces',serif;font-style:italic;color:var(--text-mute);font-size:15px}
.m-stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.m-stat{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 16px;min-width:96px}
.m-stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.m-stat .val{font-size:15px;color:var(--text);font-weight:600;margin-top:2px}
.modal-body p.desc{color:var(--text-dim);font-size:15px;margin:18px 0}
.m-sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin:22px 0 10px}
.m-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.m-list li{position:relative;padding-left:20px;color:var(--text-dim);font-size:14px}
.m-list li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.7}
.m-list.drops li::before{background:var(--accent)}


/* ---------- MODAL: DUNGEON DETAIL ---------- */
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.callout{background:var(--bg-2);border:1px solid var(--line-soft);border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin:16px 0;font-size:14px;color:var(--text-dim)}
.callout b{color:var(--text)}
.sector{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.sector:last-child{border-bottom:none}
.sector .sn{font-family:'Fraunces',serif;color:var(--gold-soft);min-width:26px}
.sector .st b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}
.sector .st span{color:var(--text-mute);font-size:13px}
.chips-inline{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chips-inline span{font-size:12px;background:var(--bg-2);border:1px solid var(--line-soft);color:var(--text-dim);padding:5px 11px;border-radius:999px}
.meta-rows{display:grid;grid-template-columns:1fr;gap:0}
.meta-row{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.meta-row:last-child{border-bottom:none}
.meta-row .rk{color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-top:2px}
.meta-row .rv{color:var(--text-dim)}
/* ---------- ROADMAP ---------- */
.phase{display:flex;gap:20px;padding:22px 0;border-bottom:1px solid var(--line-soft)}
.phase:last-child{border-bottom:none}
.phase .pn{font-family:'Fraunces',serif;font-size:34px;color:var(--line);min-width:70px;font-weight:600}
.phase h4{font-size:18px;margin-bottom:8px}
.phase p{color:var(--text-dim);font-size:14px}
/* ---------- NPC ---------- */
.npc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.npc-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:26px 24px}
.npc-card h3{font-size:22px;margin-bottom:4px}
.npc-card .role{font-family:'Fraunces',serif;font-style:italic;color:var(--gold-soft);font-size:14px;margin-bottom:14px}
.state-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.state-row:last-child{border-bottom:none}
.state-row b{color:var(--text);min-width:150px}
.state-row span{color:var(--text-mute)}


/* ---------- SITE FOOTER ---------- */
.site-foot{max-width:var(--maxw);margin:60px auto 0;padding:34px 40px 60px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--text-dim)}
.site-foot .muted{margin-top:6px}
/* ---------- RESPONSIVE ---------- */
@media (max-width:1000px){
  :root{--sidew:0px}
  .sidebar{transform:translateX(-100%);transition:transform .3s var(--ease);width:280px}
  .sidebar.open{transform:none}
  .content{margin-left:0}
  .nav-toggle{
    display:grid;place-items:center;position:fixed;top:14px;left:14px;z-index:50;
    width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-size:18px;cursor:pointer;
  }
  .topbar-inner{padding:14px 20px 14px 70px}
  section.block,.hero,.site-foot{padding-left:20px;padding-right:20px}
  .crumb{display:none}
  .dgrid2,.npc-wrap{grid-template-columns:1fr}
  .modal-body{padding:34px 22px 30px}
  .meta-row{grid-template-columns:1fr;gap:2px}
}
@media (max-width:560px){
  .hero{padding-top:56px}
  .search-wrap{width:100%}
  .topbar-inner{flex-direction:column;align-items:stretch;gap:10px}
}
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}

</style>
</head>
<body>
  <div class="bg-grain" aria-hidden="true"></div>

  <button id="navToggle" class="nav-toggle" aria-label="Menú">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">CD<span>E</span></div>
      <div class="brand-text">
        <strong>Colossal Dungeons</strong>
        <span>Enhanced</span>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <span class="dot"></span> Minecraft 1.21.1 · NeoForge
    </div>
  </aside>

  <main class="content" id="content">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="crumb" id="crumb">Inicio</span>
        <div class="search-wrap">
          <input id="globalSearch" type="search" placeholder="Buscar criaturas, trampas, puzles…" autocomplete="off" />
        </div>
      </div>
    </header>

    <div id="sections"></div>

    <footer class="site-foot">
      <p>Colossal Dungeons Enhanced — documento de diseño y producción · Estado: preproducción.</p>
      <p class="muted">Página generada a partir del documento maestro. Contenido de diseño provisional y ampliable.</p>
    </footer>
  </main>

  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
/* ============================================================
   Colossal Dungeons Enhanced — Documento de diseño (datos)
   Minecraft 1.21.1 · NeoForge
   Todo el contenido vive en window.CDE_DATA
   ============================================================ */
window.CDE_DATA = {};


/* ---------- META / PROYECTO ---------- */
CDE_DATA.meta = {
  title: "Colossal Dungeons Enhanced",
  tagline: "Siete mazmorras colosales. Un solo intento por mundo. Ningún atajo.",

  <script>
/* ============================================================
   Colossal Dungeons Enhanced — app.js
   Renderizado dinámico e interacción (sin dependencias)
   ============================================================ */
(function(){
  "use strict";
  var D = window.CDE_DATA;
  var esc = function(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var q = function(sel,ctx){ return (ctx||document).querySelector(sel); };
  var qa = function(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); };

  var dungeonById = {};
  D.dungeons.forEach(function(d){ dungeonById[d.id] = d; });
  var creatureById = {};
  D.creatures.forEach(function(c){ creatureById[c.id] = c; });

  var RANK_LABEL = { normal:"Común", elite:"Élite", miniboss:"Semijefe", boss:"Jefe", rare:"Raro / especial" };

  function dungeonName(id){
    if(id === "shared") return "Compartida";
    return dungeonById[id] ? dungeonById[id].name : id;
  }
  function dungeonColor(id){
    return dungeonById[id] ? dungeonById[id].color : "#d8b26a";
  }

  /* ---------- NAV DEFINITION ---------- */
  var NAV = [
    { id:"inicio",       label:"Inicio",           ix:"01" },
    { id:"dungeons",     label:"Las siete dungeons", ix:"02" },
    { id:"bestiario",    label:"Bestiario",        ix:"03" },
    { id:"trampas",      label:"Trampas",          ix:"04" },
    { id:"puzles",       label:"Puzles",           ix:"05" },
    { id:"mecanismos",   label:"Mecanismos",       ix:"06" },
    { id:"npcs",         label:"NPCs y campamento", ix:"07" },
    { id:"dependencias", label:"Dependencias",     ix:"08" },
    { id:"rendimiento",  label:"Rendimiento",      ix:"09" },
    { id:"roadmap",      label:"Producción",       ix:"10" }
  ];


  /* ---------- SIDEBAR NAV ---------- */
  function renderNav(){
    q("#sideNav").innerHTML = NAV.map(function(n){
      return '<a href="#'+n.id+'" data-target="'+n.id+'">'
        + '<span class="ix">'+n.ix+'</span>'+esc(n.label)+'</a>';
    }).join("");
  }

  /* ---------- HERO + INICIO ---------- */
  function renderInicio(){
    var m = D.meta;
    var stats = D.stats.map(function(s){
      return '<div class="stat reveal"><div class="v">'+esc(s.value)+'</div>'
        + '<div class="l">'+esc(s.label)+'</div><div class="s">'+esc(s.sub)+'</div></div>';
    }).join("");
    var principles = m.principles.map(function(p,i){
      var n = (i+1<10?"0":"")+(i+1);
      return '<div class="principle reveal"><span class="n">'+n+'</span><span>'+esc(p)+'</span></div>';
    }).join("");
    return ''
    + '<section class="hero" id="inicio">'
    +   '<div class="eyebrow">Documento maestro de diseño</div>'
    +   '<h1>Colossal Dungeons<span class="sub">Enhanced</span></h1>'
    +   '<p class="hero-tag">'+esc(m.tagline)+'</p>'
    +   '<div class="hero-meta">'
    +     '<span class="pill hot">'+esc(m.platform)+'</span>'
    +     '<span class="pill">Estado: '+esc(m.status)+'</span>'
    +     '<span class="pill">7 dungeons</span><span class="pill">70 criaturas</span>'
    +   '</div>'
    +   '<p class="hero-intro">'+esc(m.intro)+'</p>'
    + '</section>'
    + '<section class="block">'
    +   '<div class="stat-grid">'+stats+'</div>'
    + '</section>'
    + '<section class="block" style="padding-top:26px">'
    +   '<div class="eyebrow">Principios confirmados</div>'
    +   '<h2 class="sec-title">Reglas del proyecto</h2>'
    +   '<p class="sec-lead">Decisiones ya cerradas que gobiernan todo el diseño, desde la dificultad hasta el rendimiento y el soporte para addons.</p>'
    +   '<div class="principles">'+principles+'</div>'
    + '</section>'
    + '<div class="divider"></div>';
  }


  /* ---------- DUNGEONS ---------- */
  function renderDungeons(){
    var cards = D.dungeons.map(function(d,i){
      var boss = creatureById[d.bossId];
      var idx = (i+1<10?"0":"")+(i+1);
      return '<article class="dcard reveal" style="--c:'+d.color+'" data-dungeon="'+d.id+'">'
        + '<span class="idx">DUNGEON '+idx+'</span>'
        + '<h3>'+esc(d.name)+'</h3>'
        + '<div class="sub">'+esc(d.subtitle)+'</div>'
        + (boss ? '<div class="boss-tag">Jefe · <b>'+esc(boss.name)+'</b></div>' : '')
        + '<div class="theme">'+esc(d.themeWord)+'</div>'
        + '<span class="arrow">Ver ficha →</span>'
        + '</article>';
    }).join("");
    return '<section class="block" id="dungeons">'
      + '<div class="eyebrow">Fichas individuales</div>'
      + '<h2 class="sec-title">Las siete dungeons</h2>'
      + '<p class="sec-lead">Siete mazmorras colosales de dificultad alta y equivalente, jugables en cualquier orden. Cada una impone una regla exclusiva, un ritmo propio y un jefe final. Pulsa una ficha para ver su diseño completo.</p>'
      + '<div class="dungeon-grid">'+cards+'</div></section>'
      + '<div class="divider"></div>';
  }

  function dungeonModal(d){
    var boss = creatureById[d.bossId];
    var mobs = D.creatures.filter(function(c){ return c.dungeon === d.id; });
    var sectors = d.sectors.map(function(s,i){
      return '<div class="sector"><span class="sn">'+(i+1)+'</span>'
        + '<div class="st"><b>'+esc(s.name)+'</b><span>'+esc(s.desc)+'</span></div></div>';
    }).join("");
    function chips(arr){ return '<div class="chips-inline">'+arr.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</div>'; }
    function list(arr){ return '<ul class="m-list">'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'; }
    var rows = [
      ["Entrada", d.entrance],["Salida", d.exit],["Reinicio", d.reset],
      ["Multijugador", d.multiplayer],["Rendimiento", d.performance]
    ].map(function(r){ return '<div class="meta-row"><div class="rk">'+esc(r[0])+'</div><div class="rv">'+esc(r[1])+'</div></div>'; }).join("");
    return ''
    + '<div class="m-head" style="border-color:color-mix(in srgb,'+d.color+' 30%, var(--line-soft))">'
    +   '<div class="m-rank" style="color:'+d.color+'">Dungeon · '+esc(d.themeWord)+'</div>'
    +   '<h2>'+esc(d.name)+'</h2><div class="m-en">'+esc(d.subtitle)+'</div>'
    + '</div>'
    + '<p class="desc">'+esc(d.identity)+'</p>'
    + '<div class="callout" style="border-left-color:'+d.color+'"><b>Regla exclusiva.</b> '+esc(d.rule)+'</div>'
    + '<div class="callout"><b>Objetivo.</b> '+esc(d.objective)+'</div>'
    + (boss ? '<div class="m-sub">Jefe principal</div><p class="desc" style="margin-top:0"><b style="color:'+d.color+'">'+esc(boss.name)+'</b> — '+esc(boss.desc)+'</p>' : '')
    + '<div class="m-sub">Recorrido y sectores</div>'+sectors
    + '<div class="dgrid2" style="margin-top:22px">'
    +   '<div><div class="m-sub">Puzles</div>'+chips(d.puzzles)+'</div>'
    +   '<div><div class="m-sub">Trampas</div>'+chips(d.traps)+'</div>'
    + '</div>'
    + '<div class="dgrid2" style="margin-top:20px">'
    +   '<div><div class="m-sub">Loot</div>'+list(d.loot)+'</div>'
    +   '<div><div class="m-sub">Armas y accesorios</div>'+list(d.weapons)+'</div>'
    + '</div>'
    + '<div class="dgrid2" style="margin-top:20px">'
    +   '<div><div class="m-sub">Eventos</div>'+list(d.events)+'</div>'
    +   '<div><div class="m-sub">Secretos y rutas</div>'+list(d.secrets)+'</div>'
    + '</div>'
    + '<div class="m-sub">Enemigos asignados ('+mobs.length+')</div>'+chips(mobs.map(function(c){return c.name+" · "+RANK_LABEL[c.rank];}))
    + '<div class="m-sub">Entrada · salida · reinicio</div><div class="meta-rows">'+rows+'</div>';
  }


  /* ---------- BESTIARIO ---------- */
  var bestState = { dungeon:"all", rank:"all", search:"" };

  function renderBestiario(){
    var dChips = '<div class="chip active" data-f="dungeon" data-v="all">Todas</div>'
      + '<div class="chip" data-f="dungeon" data-v="shared">Compartidas</div>'
      + D.dungeons.map(function(d){ return '<div class="chip" data-f="dungeon" data-v="'+d.id+'">'+esc(d.name)+'</div>'; }).join("");
    var rChips = '<div class="chip active" data-f="rank" data-v="all">Todos los rangos</div>'
      + ["normal","elite","miniboss","boss","rare"].map(function(r){
          return '<div class="chip" data-f="rank" data-v="'+r+'">'+RANK_LABEL[r]+'</div>'; }).join("");
    return '<section class="block" id="bestiario">'
      + '<div class="eyebrow">Criaturas, IA y combate</div>'
      + '<h2 class="sec-title">Bestiario · 70 criaturas</h2>'
      + '<p class="sec-lead">Objetivo base de 70 criaturas únicas (hasta 90 con variantes), al menos un jefe y dos semijefes por dungeon. Filtra por mazmorra o rango, o busca por nombre. Pulsa una criatura para ver su ficha completa.</p>'
      + '<div class="filters" id="fDungeon">'+dChips+'</div>'
      + '<div class="filters ranks" id="fRank">'+rChips+'</div>'
      + '<div class="count-line" id="mobCount"></div>'
      + '<div class="mob-grid" id="mobGrid"></div></section>'
      + '<div class="divider"></div>';
  }

  function mobMatches(c){
    if(bestState.dungeon!=="all" && c.dungeon!==bestState.dungeon) return false;
    if(bestState.rank!=="all" && c.rank!==bestState.rank) return false;
    if(bestState.search){
      var hay=(c.name+" "+c.en+" "+c.desc+" "+dungeonName(c.dungeon)).toLowerCase();
      if(hay.indexOf(bestState.search.toLowerCase())===-1) return false;
    }
    return true;
  }

  function renderMobGrid(){
    var list = D.creatures.filter(mobMatches);
    var grid = q("#mobGrid"); if(!grid) return;
    q("#mobCount").textContent = list.length + (list.length===1?" criatura":" criaturas");
    if(!list.length){ grid.innerHTML='<div class="empty">Sin resultados con estos filtros.</div>'; return; }
    grid.innerHTML = list.map(function(c){
      var col = dungeonColor(c.dungeon);
      return '<article class="mcard" data-mob="'+c.id+'" style="--dc:'+col+'">'
        + '<span class="rank r-'+c.rank+'">'+RANK_LABEL[c.rank]+'</span>'
        + '<h4>'+esc(c.name)+'</h4><div class="en">'+esc(c.en)+'</div>'
        + '<div class="home">'+esc(dungeonName(c.dungeon))+'</div>'
        + '<div class="stats-mini"><span><b>♥</b> '+esc(c.hp)+'</span>'
        + '<span><b>⛨</b> '+esc(c.armor)+'</span><span><b>⚔</b> '+esc(c.dmg)+'</span></div>'
        + '</article>';
    }).join("");
  }

  function mobModal(c){
    function list(arr,cls){ if(!arr||!arr.length) return ""; return '<ul class="m-list '+(cls||"")+'">'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'; }
    var col = dungeonColor(c.dungeon);
    return '<div class="m-head"><div class="m-rank r-'+c.rank+'" style="display:inline-block;padding:4px 12px;border-radius:999px">'+RANK_LABEL[c.rank]+'</div>'
      + '<h2>'+esc(c.name)+'</h2><div class="m-en">'+esc(c.en)+' · <span style="color:'+col+'">'+esc(dungeonName(c.dungeon))+'</span></div></div>'
      + '<div class="m-stats"><div class="m-stat"><div class="k">Vida</div><div class="val">'+esc(c.hp)+'</div></div>'
      + '<div class="m-stat"><div class="k">Armadura</div><div class="val">'+esc(c.armor)+'</div></div>'
      + '<div class="m-stat"><div class="k">Daño</div><div class="val">'+esc(c.dmg)+'</div></div></div>'
      + '<p class="desc">'+esc(c.desc)+'</p>'
      + (c.behavior&&c.behavior.length ? '<div class="m-sub">Comportamiento y ataques</div>'+list(c.behavior) : '')
      + (c.drops&&c.drops.length ? '<div class="m-sub">Botín</div>'+list(c.drops,"drops") : '');
  }


  /* ---------- TRAMPAS / PUZLES / MECANISMOS ---------- */
  function catCard(o){
    var isNew = o.nuevo;
    var tag = o.category ? '<span class="tag">'+esc(o.category)+'</span>' : '';
    var homes = o.dungeon ? o.dungeon.map(dungeonName).join(" · ") : "";
    var cfg = o.config ? '<div class="cfg">'+o.config.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</div>' : "";
    return '<article class="tcard reveal"><h4>'+esc(o.name)+(isNew?'<span class="badge-new">NUEVO</span>':'')+'</h4>'
      + tag + '<p>'+esc(o.desc)+'</p>'
      + (homes?'<div class="cfg" style="margin-top:10px"><span style="color:var(--gold-soft);border-color:rgba(216,178,106,.3)">'+esc(homes)+'</span></div>':'')
      + cfg + '</article>';
  }

  function renderTrampas(){
    return '<section class="block" id="trampas">'
      + '<div class="eyebrow">Peligros del entorno</div>'
      + '<h2 class="sec-title">Trampas y peligros</h2>'
      + '<p class="sec-lead">Familias de trampas configurables y reutilizables, cada una con variante temática por dungeon. Las marcadas como NUEVO amplían el catálogo original con peligros propios de cada mazmorra.</p>'
      + '<div class="card-grid">'+D.traps.map(catCard).join("")+'</div></section>'
      + '<div class="divider"></div>';
  }
  function renderPuzles(){
    return '<section class="block" id="puzles">'
      + '<div class="eyebrow">Ingenio y cooperación</div>'
      + '<h2 class="sec-title">Puzles</h2>'
      + '<p class="sec-lead">Puzles altamente configurables y compatibles con addons: solución, dificultad, castigos, recompensas y modo individual o cooperativo. Cada dungeon reutiliza y reinterpreta varios.</p>'
      + '<div class="card-grid">'+D.puzzles.map(catCard).join("")+'</div></section>'
      + '<div class="divider"></div>';
  }
  function renderMecanismos(){
    return '<section class="block" id="mecanismos">'
      + '<div class="eyebrow">Activadores y señales</div>'
      + '<h2 class="sec-title">Mecanismos</h2>'
      + '<p class="sec-lead">La base física reutilizable del mod: activadores, mecanismos manuales, pasadizos y el sistema de resonancia que conecta sonido, sigilo, trampas y secretos.</p>'
      + '<div class="card-grid">'+D.mechanisms.map(catCard).join("")+'</div></section>'
      + '<div class="divider"></div>';
  }


  /* ---------- NPCs ---------- */
  function renderNpcs(){
    var camp = D.camp, v = D.valdris;
    var fns = camp.functions.map(function(f){return '<li>'+esc(f)+'</li>';}).join("");
    var states = v.states.map(function(s){
      return '<div class="state-row"><b>'+esc(s.name)+'</b><span>'+esc(s.detail)+'</span></div>';
    }).join("");
    return '<section class="block" id="npcs">'
      + '<div class="eyebrow">Mundo exterior</div>'
      + '<h2 class="sec-title">NPCs y campamento</h2>'
      + '<p class="sec-lead">Fuera de las mazmorras, el campamento de aventureros es el punto de entrada al mod. Los NPCs usan un sistema propio de diálogos con memoria por jugador, decisiones y consecuencias.</p>'
      + '<div class="npc-wrap">'
      +   '<div class="npc-card reveal"><h3>'+esc(camp.title)+'</h3>'
      +     '<div class="role">Centro de operaciones</div>'
      +     '<p style="color:var(--text-dim);font-size:14px">'+esc(camp.desc)+'</p>'
      +     '<div class="m-sub">Funciones</div><ul class="m-list">'+fns+'</ul>'
      +     '<div class="m-sub">Compañeros</div><p style="color:var(--text-dim);font-size:13.5px">'+esc(camp.companions)+'</p>'
      +     '<div class="m-sub">Diálogos</div><p style="color:var(--text-dim);font-size:13.5px">'+esc(camp.dialogue)+'</p>'
      +   '</div>'
      +   '<div class="npc-card reveal"><h3>'+esc(v.name)+'</h3>'
      +     '<div class="role">'+esc(v.role)+'</div>'
      +     '<p style="color:var(--text-dim);font-size:14px">'+esc(v.desc)+'</p>'
      +     '<div class="m-sub">Estados de IA</div>'+states
      +     '<div class="m-sub">Contratos invisibles</div><p style="color:var(--text-dim);font-size:13.5px">'+esc(v.contracts)+'</p>'
      +     '<div class="m-sub">Robo</div><p style="color:var(--text-dim);font-size:13.5px">'+esc(v.theft)+'</p>'
      +     '<div class="m-sub">¿Matarlo?</div><p style="color:var(--text-dim);font-size:13.5px">'+esc(v.kill)+'</p>'
      +   '</div>'
      + '</div></section><div class="divider"></div>';
  }

  /* ---------- DEPENDENCIAS ---------- */
  function renderDeps(){
    var cards = D.dependencies.map(function(dep){
      var uses = dep.uses.map(function(u){return '<li>'+esc(u)+'</li>';}).join("");
      var flag = dep.highlight ? '<span class="badge-new" style="background:rgba(216,178,106,.16);color:var(--gold-soft);border-color:rgba(216,178,106,.35)">SUSTITUYE A PHOTON</span>'
        : (dep.provisional ? '<span class="badge-new">PROVISIONAL</span>' : '');
      return '<article class="tcard reveal"'+(dep.highlight?' style="border-color:rgba(216,178,106,.4)"':'')+'>'
        + '<h4>'+esc(dep.name)+flag+'</h4>'
        + '<span class="tag">'+esc(dep.role)+'</span>'
        + '<p>'+esc(dep.desc)+'</p>'
        + '<div class="m-sub" style="margin:14px 0 8px">Usos</div><ul class="m-list">'+uses+'</ul>'
        + (dep.note?'<p style="color:var(--text-mute);font-size:12.5px;margin-top:12px">'+esc(dep.note)+'</p>':'')
        + '</article>';
    }).join("");
    return '<section class="block" id="dependencias">'
      + '<div class="eyebrow">Plataforma y arquitectura</div>'
      + '<h2 class="sec-title">Dependencias</h2>'
      + '<p class="sec-lead">El mod se desarrolla para NeoForge 1.21.1. El motor de efectos visuales pasa de Photon a <b style="color:var(--gold-soft)">AAA Particles</b> (efectos Effekseer). Varias dependencias son provisionales y se migrarán al framework interno.</p>'
      + '<div class="card-grid">'+cards+'</div></section><div class="divider"></div>';
  }


  /* ---------- RENDIMIENTO ---------- */
  function renderPerf(){
    var items = [
      ["Principio central","La dungeon puede ser enorme, pero solo una pequeña parte está activa a la vez."],
      ["Activación por sala","Estados: no cargada, preparada, activa, completada, dormida, suspendida. Solo las salas cercanas ejecutan IA, trampas, block entities y VFX."],
      ["Presupuesto de entidades","8–15 mobs activos en exploración normal; 15–25 en encuentros grandes; un jefe con acompañantes limitados. Pathfinding limitado a la sala."],
      ["Trampas y block entities","Las trampas inactivas no hacen tick; un controlador de sala gestiona señales y temporizadores; la decoración es bloque estático siempre que se pueda."],
      ["VFX y animaciones","Perfiles gráficos bajo/medio/alto: se reducen partículas, estelas, luces, objetos dentro del Gelatinous Cube y animaciones lejanas."],
      ["Multijugador","Presupuesto por grupo, límite de salas activas, reinicios bloqueados con jugadores dentro y sincronización de puertas, trampas, jefes y salas cambiantes."],
      ["Medición","El rendimiento se mide desde los primeros prototipos con perfiles de servidor y cliente. No se deja la optimización para el final."]
    ];
    var rows = items.map(function(r){
      return '<div class="meta-row reveal"><div class="rk">'+esc(r[0])+'</div><div class="rv">'+esc(r[1])+'</div></div>';
    }).join("");
    return '<section class="block" id="rendimiento">'
      + '<div class="eyebrow">Rendimiento y multijugador</div>'
      + '<h2 class="sec-title">Diseñado para rendir</h2>'
      + '<p class="sec-lead">El rendimiento se diseña desde el framework. Una sola copia de cada dungeon por mundo, generación por lotes y activación estricta por sala.</p>'
      + '<div class="meta-rows">'+rows+'</div></section><div class="divider"></div>';
  }

  /* ---------- ROADMAP ---------- */
  function renderRoadmap(){
    var phases = [
      ["01","Núcleo reutilizable","Framework interno de trampas, activadores y señales, temporizadores, hitboxes, movimiento físico, efectos, guardado, networking y herramientas de depuración."],
      ["02","Mobs y NPCs","Plantillas modulares de mobs, IA táctica, percepción y navegación, ataques, diálogos, comerciantes, memoria por jugador. Valdris, Gelatinous Cube, Neotélido y Mimic."],
      ["03","Mazmorras oficiales","Las siete dungeons, cada una con sus trampas, mobs, puzles, eventos, loot, NPCs y reglas exclusivas."],
      ["04","API de addons","Registros públicos, eventos, plantillas, documentación, ejemplos, compatibilidad estable y validadores para contenido externo."],
      ["05","Sistemas avanzados","Generación procedural selectiva, arquitectura cambiante, intercambio de salas y validación de rutas (en espera)."]
    ];
    var html = phases.map(function(p){
      return '<div class="phase reveal"><div class="pn">'+p[0]+'</div><div><h4>'+esc(p[1])+'</h4><p>'+esc(p[2])+'</p></div></div>';
    }).join("");
    return '<section class="block" id="roadmap">'
      + '<div class="eyebrow">Producción y roadmap</div>'
      + '<h2 class="sec-title">Fases de desarrollo</h2>'
      + '<p class="sec-lead">Del framework reutilizable al lanzamiento y los addons de la comunidad, que son un objetivo central del proyecto.</p>'
      + html + '</section>';
  }


  /* ---------- MODAL ---------- */
  var modal = null, modalBody = null;
  function openModal(html){
    modalBody.innerHTML = html;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    modalBody.parentNode.scrollTop = 0;
  }
  function closeModal(){
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  /* ---------- SCROLLSPY ---------- */
  function initScrollSpy(){
    var links = qa("#sideNav a");
    var map = {}; links.forEach(function(a){ map[a.getAttribute("data-target")] = a; });
    var ids = NAV.map(function(n){return n.id;});
    var crumb = q("#crumb");
    function onScroll(){
      var pos = window.scrollY + 140, current = ids[0];
      ids.forEach(function(id){
        var el = document.getElementById(id);
        if(el && el.offsetTop <= pos) current = id;
      });
      links.forEach(function(a){ a.classList.remove("active"); });
      if(map[current]){ map[current].classList.add("active");
        var lbl = NAV.filter(function(n){return n.id===current;})[0];
        if(lbl) crumb.textContent = lbl.label;
      }
    }
    window.addEventListener("scroll", onScroll, { passive:true });
    onScroll();
  }

  /* ---------- REVEAL ON SCROLL ---------- */
  function initReveal(){
    if(!("IntersectionObserver" in window)){ qa(".reveal").forEach(function(e){e.classList.add("in");}); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold:.12 });
    qa(".reveal").forEach(function(e){ io.observe(e); });
  }


  /* ---------- BOOT ---------- */
  function boot(){
    renderNav();
    q("#sections").innerHTML =
        renderInicio() + renderDungeons() + renderBestiario()
      + renderTrampas() + renderPuzles() + renderMecanismos()
      + renderNpcs() + renderDeps() + renderPerf() + renderRoadmap();

    renderMobGrid();

    modal = q("#modal"); modalBody = q("#modalBody");
    q("#modalClose").addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

    /* Dungeon + mob cards (event delegation) */
    q("#sections").addEventListener("click", function(e){
      var dc = e.target.closest("[data-dungeon]");
      if(dc){ var d = dungeonById[dc.getAttribute("data-dungeon")]; if(d) openModal(dungeonModal(d)); return; }
      var mc = e.target.closest("[data-mob]");
      if(mc){ var c = creatureById[mc.getAttribute("data-mob")]; if(c) openModal(mobModal(c)); return; }
      var chip = e.target.closest(".chip");
      if(chip){
        var f = chip.getAttribute("data-f"), v = chip.getAttribute("data-v");
        var parent = chip.parentNode;
        qa(".chip", parent).forEach(function(c){ c.classList.remove("active"); });
        chip.classList.add("active");
        bestState[f] = v; renderMobGrid();
      }
    });

    /* Global search -> feeds bestiary + jumps to it */
    var search = q("#globalSearch");
    search.addEventListener("input", function(){
      bestState.search = search.value.trim();
      renderMobGrid();
    });
    search.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ document.getElementById("bestiario").scrollIntoView({behavior:"smooth"}); }
    });

    /* Mobile nav */
    var sidebar = q("#sidebar"), toggle = q("#navToggle");
    toggle.addEventListener("click", function(){ sidebar.classList.toggle("open"); });
    q("#sideNav").addEventListener("click", function(e){
      if(e.target.closest("a")) sidebar.classList.remove("open");
    });

    initScrollSpy();
    initReveal();
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
